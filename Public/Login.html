<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in</title>
<style>
  :root {
    --bg: #eef1f5;
    --surface: #ffffff;
    --text: #1b2430;
    --muted: #5b6676;
    --line: #cfd6e0;
    --accent: #1f5eff;
    --accent-hover: #1749cc;
    --error: #c62828;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12161c;
      --surface: #1b212a;
      --text: #e8ecf2;
      --muted: #9aa5b5;
      --line: #364050;
      --accent: #5b8aff;
      --accent-hover: #7a9fff;
      --error: #ff6b6b;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 1.5rem;
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    width: 100%;
    max-width: 380px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 2rem;
  }
  h1 { margin: 0 0 .25rem; font-size: 1.5rem; }
  .sub { margin: 0 0 1.5rem; color: var(--muted); font-size: .95rem; }
  label { display: block; margin-bottom: .35rem; font-size: .9rem; font-weight: 600; }
  .field { margin-bottom: 1rem; }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%;
    padding: .7rem .8rem;
    font: inherit;
    color: var(--text);
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  input:focus-visible, button:focus-visible, a:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
  .pw { position: relative; }
  .pw input { padding-right: 4.2rem; }
  .toggle {
    position: absolute; right: .4rem; top: 50%; transform: translateY(-50%);
    background: none; border: 0; padding: .35rem .5rem;
    color: var(--accent); font: inherit; font-size: .85rem; cursor: pointer;
  }
  .row {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 1.25rem; font-size: .9rem;
  }
  .row label { display: flex; gap: .4rem; align-items: center; margin: 0; font-weight: 400; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .submit {
    width: 100%; padding: .75rem; font: inherit; font-weight: 600;
    color: #fff; background: var(--accent);
    border: 0; border-radius: 8px; cursor: pointer;
  }
  .submit:hover { background: var(--accent-hover); }
  .error { min-height: 1.2rem; margin: 0 0 .75rem; color: var(--error); font-size: .9rem; }
  .foot { margin: 1.5rem 0 0; text-align: center; color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
  <main class="card">
    <h1>Log in</h1>
    <p class="sub">Enter your email and password to continue.</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="email">Email or Username</label>
        <input type="email" id="email" name="email" autocomplete="email" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input type="password" id="password" name="password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password">Show</button>
        </div>
      </div>

      <div class="row">
        <label><input type="checkbox" name="remember"> Remember me</label>
      
      </div>

      <p class="error" id="error" role="alert"></p>
      <button type="submit" class="submit">Log in</button>
    </form>

    <p class="foot">  If account  not exist we will create one for you</p>
  </main>
<script src="functioning.js"></script>
<script>
  const form = document.getElementById('loginForm');
  const email = document.getElementById('email');
  const password = document.getElementById('password');
  const error = document.getElementById('error');
  const toggle = document.getElementById('toggle');

  toggle.addEventListener('click', () => {
    const show = password.type === 'password';
    password.type = show ? 'text' : 'password';
    toggle.textContent = show ? 'Hide' : 'Show';
    toggle.setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    error.textContent = '';

    if (!email.value.trim() || !/^\S+@\S+\.\S+$/.test(email.value)) {
      error.textContent = 'Enter a valid email address.';
      email.focus();
      return;
    }
    if (password.value.length < 6) {
      error.textContent = 'Password must be at least 6 characters.';
      password.focus();
      return;
    }
   
   let response= UsingApi({ email: email.value, password: password.value }, '/api/login', 'POST');
   if(response.ok)   windows.location.href="/dashboard";
   else  console.log({response});
   
   
   
 
    // Replace with your real API call, e.g.:
    // fetch('/api/login', { method: 'POST', headers: {'Content-Type': 'application/json'},
    //   body: JSON.stringify({ email: email.value, password: password.value }) })
    console.log('Logging in with', email.value);
  });
</script>

</body>
</html>
