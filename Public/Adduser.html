<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add User</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 60px 16px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    form {
      display: flex;
      gap: 8px;
      width: 70vw;
      max-width: 100%;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      outline: none;
    }
    input:focus { border-color: #4285f4; }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 24px;
      background: #4285f4;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .list {
      width: 70vw;
      max-width: 100%;
      height: calc(100vh - 220px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 8px;
    }

    .list p {
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .list p:hover { background: #eef2ff; }
  </style>
</head>
<body>
  <form id="searchBox" autocomplete="off">
    <input type="text" id="searchInput" placeholder="Add new friend..." />
    <button type="submit" id="submit-button" >Add +</button>
     <a href="../index.html" class="add-user-btn"  type="submit">Add +</a>
  </form>

  <div class="list" id="history">
   <ul id="friendList"></ul>
  </div>
</body>


</script>
<script>

   let uid=document.cookie;
  uid=uid.split("=");
  console.log(uid[1]);

 const friendList = document.getElementById("friendList");

function renderFriends(friends) {
  friendList.innerHTML = ""; // clear the old list first

  if (!friends || friends.length === 0) {
    const li = document.createElement("li");
    li.textContent = "No friends yet.";
    friendList.appendChild(li);
    return;
  }

  friends.forEach((friend) => {
    const li = document.createElement("li");
    li.textContent = friend; // textContent is safe; innerHTML with user data is not
    friendList.appendChild(li);
  });
}





document.addEventListener("DOMContentLoaded",async()=>{
 
try{

  const res=await fetch('/friend/GetFriends',{
      method:'POST',
      headers:{
        'Content-Type': 'application/json'
      },
      body:JSON.stringify({ id: uid[1] })
    });
   
    let response= await res.json();
    renderFriends(response.friends);

      error.textContent = 'Login failed. Please check your credentials.';
      return;}
          return response; }
      catch(error){
        error.textContent = 'An error occurred. Please try again.';
        
      }
  
});

</script>
</html>
