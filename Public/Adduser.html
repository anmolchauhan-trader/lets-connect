<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Add User</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 60px 16px;
      font-family: system-ui, sans-serif;
      background: #f5f5f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }

    form {
      display: flex;
      gap: 8px;
      width: 70vw;
      max-width: 100%;
    }

    input {
      flex: 1;
      padding: 12px 16px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 24px;
      outline: none;
    }
    input:focus { border-color: #4285f4; }

    button {
      padding: 0 18px;
      border: none;
      border-radius: 24px;
      background: #4285f4;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
    }

    .list {
      width: 70vw;
      max-width: 100%;
      height: calc(100vh - 220px);
      overflow-y: auto;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 16px;
      padding: 8px;
    }

    .list p {
      margin: 0;
      padding: 12px 14px;
      border-radius: 10px;
      cursor: pointer;
    }
    .list p:hover { background: #eef2ff; }
  </style>
</head>
<body>
  <form id="searchBox" autocomplete="off">
    <input type="text" id="searchInput" placeholder="Add new friend..." />
    <button type="submit">Add +</button>

  </div>
</body>
